<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">SonyYNee — Ideias em sistemas</title>
  <desc id="desc">Banner azul escuro com tipografia clara, detalhes em cobre e uma rede de conexões animada.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111f2d"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#52b8bd" stop-opacity=".14"/><stop offset="1" stop-color="#52b8bd" stop-opacity="0"/></radialGradient>
    <linearGradient id="line"><stop stop-color="#62c2c4" stop-opacity=".1"/><stop offset=".55" stop-color="#62c2c4" stop-opacity=".7"/><stop offset="1" stop-color="#d7ad82" stop-opacity=".4"/></linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#a0c5d1" opacity=".09"/></pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="428" rx="25"/></clipPath>
    <style>
      text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;}
      .orbit {transform-origin:930px 214px; animation:orbit 48s linear infinite;}
      .signal {stroke-dasharray:4 16; animation:signal 7s linear infinite;}
      .pulse {transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite;}
      .p2 {animation-delay:1.3s;}.p3 {animation-delay:2.6s;}
      .cursor {animation:blink 1.8s steps(2,end) infinite;}
      .float {animation:float 8s ease-in-out infinite;}
      @keyframes orbit {to{transform:rotate(360deg);}}
      @keyframes signal {to{stroke-dashoffset:-120;}}
      @keyframes pulse {0%,100%{opacity:.35;transform:scale(1);}50%{opacity:1;transform:scale(1.2);}}
      @keyframes blink {50%{opacity:.15;}}
      @keyframes float {0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
      @media(prefers-reduced-motion:reduce){.orbit,.signal,.pulse,.cursor,.float{animation:none;}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <rect x="650" width="550" height="430" fill="url(#dots)"/>
    <ellipse cx="945" cy="200" rx="330" ry="300" fill="url(#light)"/>
    <path d="M72 63H108" stroke="#d7ad82" stroke-width="3" stroke-linecap="round"/>
    <text x="123" y="69" fill="#a9becb" font-size="13" font-weight="600" letter-spacing="3">SONYYNEE / DIGITAL CRAFT</text>
    <text x="70" y="160" fill="#f3f5f6" font-size="62" font-weight="700" letter-spacing="-2">Ideias em</text>
    <text x="70" y="228" fill="#dfb88e" font-size="62" font-weight="700" letter-spacing="-2">sistemas.</text>
    <rect class="cursor" x="329" y="184" width="4" height="47" rx="2" fill="#dfb88e"/>
    <text x="73" y="274" fill="#a8bdca" font-size="17">Design, código e evolução contínua.</text>
    <path d="M73 321H624" stroke="#94b6c9" stroke-opacity=".14"/>
    <circle class="pulse" cx="78" cy="355" r="4" fill="#71c8b4"/>
    <text x="94" y="360" fill="#a8bdca" font-size="12" letter-spacing="2">CONSTRUIR. SIMPLIFICAR. EVOLUIR.</text>
    <g fill="none" stroke="#5d8b9d" stroke-opacity=".23">
      <circle cx="930" cy="214" r="150"/>
      <circle cx="930" cy="214" r="105"/>
      <path d="M780 214H1080M930 64V364" stroke-dasharray="3 9"/>
    </g>
    <g class="orbit" fill="none">
      <circle cx="930" cy="214" r="150" stroke="#6dc6c7" stroke-opacity=".6" stroke-dasharray="54 889" stroke-width="2"/>
      <circle cx="1080" cy="214" r="4" fill="#6dc6c7"/>
    </g>
    <g class="float">
      <path d="M827 139L930 214L1035 137M930 214L1032 288M930 214L828 290" fill="none" stroke="url(#line)" stroke-width="1.5"/>
      <path class="signal" d="M827 139L930 214L1035 137M930 214L1032 288M930 214L828 290" fill="none" stroke="#77d1cc" stroke-width="2"/>
      <g fill="#101e2b" stroke="#426474">
        <rect x="794" y="110" width="66" height="58" rx="15"/>
        <rect x="1002" y="108" width="66" height="58" rx="15"/>
        <rect x="795" y="261" width="66" height="58" rx="15"/>
        <rect x="999" y="259" width="66" height="58" rx="15"/>
      </g>
      <g fill="none" stroke="#8db0be" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
        <path d="M814 130H840V148H814ZM814 135H840M819 140H826M819 144H833"/>
        <path d="M1028 126L1019 137L1028 148M1042 126L1051 137L1042 148M1038 124L1032 150"/>
        <path d="M817 292V298M828 286V298M839 278V298"/>
        <path d="M1021 282L1032 276L1043 282V294L1032 300L1021 294ZM1021 282L1032 288L1043 282M1032 288V300"/>
      </g>
      <rect x="885" y="169" width="90" height="90" rx="25" fill="#1c313d" stroke="#d7ad82" stroke-opacity=".65"/>
      <text x="930" y="226" text-anchor="middle" fill="#e4bd96" font-size="32" font-weight="600" letter-spacing="-2">SY</text>
      <circle class="pulse p2" cx="860" cy="139" r="3" fill="#72c9c4"/>
      <circle class="pulse p3" cx="999" cy="288" r="3" fill="#dfb88e"/>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="428" rx="25" fill="none" stroke="#7292a3" stroke-opacity=".22"/>
</svg>
